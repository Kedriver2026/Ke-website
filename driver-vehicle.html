<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K&E Connect | Vehicle Information</title><link rel="stylesheet" href="styles.css"><style>body{background:#041426;color:#fff}.wrap{width:min(720px,calc(100% - 32px));margin:auto;padding:28px 0 70px}.brand{text-align:center}.brand img{width:210px}.card{background:#0b2139;border:1px solid #173652;border-radius:24px;padding:24px;margin-top:20px}.muted{color:#9fb0c5;line-height:1.55}.form{display:grid;gap:14px}.form label{display:grid;gap:7px;font-weight:800}.form input{box-sizing:border-box;width:100%;min-width:0;background:#071a2e;color:#fff;border:1px solid #294966;border-radius:14px;padding:14px;font:inherit}.filebox{box-sizing:border-box;width:100%;min-width:0;background:#071a2e;border:1px solid #173652;border-radius:14px;padding:14px}.button{border:0;cursor:pointer}.status{display:none;margin-top:14px;padding:14px;border-radius:14px}.success{display:block;background:#0b342b;border:1px solid #1d765e}.error{display:block;background:#3a1720;border:1px solid #8a3447}.back{display:block;text-align:center;color:#5bb2ff;text-decoration:none;font-weight:900;margin-top:18px}.progress{height:8px;background:#102f4d;border-radius:8px;overflow:hidden;margin-top:12px}.progress span{display:block;width:50%;height:100%;background:#1484ff}@media(max-width:600px){.wrap{width:min(100% - 24px,720px);padding-top:18px}.card{padding:20px}.brand img{width:185px}.form{width:100%}.form label{min-width:0}.form input{max-width:100%}.filebox{overflow:hidden}}</style></head><body><main class="wrap"><div class="brand"><img src="ke-connect-logo-new.png" alt="K&E Connect"><p>Verified Applicant Onboarding</p></div><section class="card"><p class="eyebrow">STEP 2 OF 4</p><h1>Vehicle Information</h1><p class="muted">Add your vehicle details and upload current insurance and registration.</p><div class="progress"><span></span></div><form id="vehicle" class="form"><label>Vehicle type<input id="vehicleType" placeholder="Example: Cargo van" required></label><label>Year / make / model<input id="vehicleDescription" placeholder="Example: 2022 Ford Transit" required></label><label>License plate<input id="plate" required></label><div class="filebox"><label>Current auto insurance<input id="insurance" type="file" accept="image/*,application/pdf" required></label></div><div class="filebox"><label>Current vehicle registration<input id="registration" type="file" accept="image/*,application/pdf" required></label></div><button class="button primary" id="submitBtn" type="submit">Save & Continue</button></form><div id="status" class="status"></div><a class="back" href="driver-onboarding.html">← Back to Onboarding</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://yvppsjgyedqcvfbhrhrm.supabase.co','sb_publishable_2QMw5NredQMVvWOHhV1gWg_YYuOryO7');const box=document.getElementById('status');function show(t,m){box.className='status '+t;box.textContent=m}async function upload(file,userId,prefix){const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=userId+'/'+prefix+'-'+Date.now()+'.'+ext;const{error}=await client.storage.from('driver-documents').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});if(error)throw error}(async()=>{const{data}=await client.auth.getSession();if(!data.session)location.href='/driver-application.html';})();document.getElementById('vehicle').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Saving…';try{const{data:{user}}=await client.auth.getUser();if(!user)throw new Error('Your verified session expired.');const vehicleType=document.getElementById('vehicleType').value.trim(),vehicleDescription=document.getElementById('vehicleDescription').value.trim(),plate=document.getElementById('plate').value.trim(),insurance=document.getElementById('insurance').files[0],registration=document.getElementById('registration').files[0];if(!vehicleType||!vehicleDescription||!plate||!insurance||!registration)throw new Error('Complete all fields and uploads.');const{error:saveError}=await client.rpc('save_driver_vehicle_section',{p_vehicle_type:vehicleType,p_vehicle_description:vehicleDescription,p_license_plate:plate});if(saveError)throw saveError;await upload(insurance,user.id,'insurance');await upload(registration,user.id,'registration');const{error:updateError}=await client.from('drivers').update({insurance_review_status:'pending',registration_review_status:'pending'}).eq('user_id',user.id);if(updateError)throw updateError;show('success','Vehicle information saved. Moving to Background Check…');setTimeout(()=>location.href='/driver-background-check.html',700);}catch(err){show('error',err.message||'Could not save vehicle information.');btn.disabled=false;btn.textContent='Save & Continue';}});</script></body></html>
