<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K&E Connect | Vehicle Information</title><link rel="stylesheet" href="styles.css"><style>body{background:#041426;color:#fff}.wrap{width:min(720px,calc(100% - 32px));margin:auto;padding:28px 0 70px}.brand{text-align:center}.brand img{width:210px}.card{background:#0b2139;border:1px solid #173652;border-radius:24px;padding:24px;margin-top:20px}.muted{color:#9fb0c5;line-height:1.55}.form{display:grid;gap:14px}.form label{display:grid;gap:7px;font-weight:800}.form input{box-sizing:border-box;width:100%;min-width:0;background:#071a2e;color:#fff;border:1px solid #294966;border-radius:14px;padding:14px;font:inherit}.filebox{box-sizing:border-box;width:100%;min-width:0;background:#071a2e;border:1px solid #173652;border-radius:14px;padding:14px}.button{border:0;cursor:pointer}.status{display:none;margin-top:14px;padding:14px;border-radius:14px}.success{display:block;background:#0b342b;border:1px solid #1d765e}.error{display:block;background:#3a1720;border:1px solid #8a3447}.back{display:block;text-align:center;color:#5bb2ff;text-decoration:none;font-weight:900;margin-top:18px}.progress{height:8px;background:#102f4d;border-radius:8px;overflow:hidden;margin-top:12px}.progress span{display:block;width:50%;height:100%;background:#1484ff}@media(max-width:600px){.wrap{width:min(100% - 24px,720px);padding-top:18px}.card{padding:20px}.brand img{width:185px}.form{width:100%}.form label{min-width:0}.form input{max-width:100%}.filebox{overflow:hidden}}</style></head><body><main class="wrap"><div class="brand"><img src="ke-connect-logo-new.png" alt="K&E Connect"><p>Verified Applicant Onboarding</p></div><section class="card"><p class="eyebrow">STEP 2 OF 4</p><h1>Vehicle Information</h1><p class="muted">Add your vehicle details and upload current insurance and registration. Include a photo of the vehicle you’ll drive.</p><div class="progress"><span></span></div><form id="vehicle" class="form"><label>Vehicle type<input id="vehicleType" placeholder="Example: Cargo van" required></label><label>Year / make / model<input id="vehicleDescription" placeholder="Example: 2022 Ford Transit" required></label><label>License plate<input id="plate" required></label><div class="filebox"><label>Current auto insurance<input id="insurance" type="file" accept="image/*,application/pdf" required></label></div><div class="filebox"><label>Current vehicle registration<input id="registration" type="file" accept="image/*,application/pdf" required></label><label>Vehicle photo (required)<input id="vehiclePhoto" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="vehiclePhotoStatus" required></label><p id="vehiclePhotoStatus" class="muted">Upload a clear photo of the vehicle you’ll drive. JPG, PNG or WebP, up to 5 MB.</p></div><button class="button primary" id="submitBtn" type="submit">Save & Continue</button></form><div id="status" class="status"></div><a class="back" href="driver-onboarding.html">← Back to Onboarding</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="driver-document-upload.js"></script><script>const client=supabase.createClient('https://yvppsjgyedqcvfbhrhrm.supabase.co','sb_publishable_2QMw5NredQMVvWOHhV1gWg_YYuOryO7');let documentSubmit=null,documentUserId=null,savedVehiclePhoto=null;const expectedPaths={};const box=document.getElementById('status');function show(t,m){box.className='status '+t;box.textContent=m}const photoTypes=Object.freeze({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'});
function setVehiclePhotoStatus(){document.getElementById('vehiclePhoto').required=!savedVehiclePhoto;document.getElementById('vehiclePhotoStatus').textContent=savedVehiclePhoto?'A vehicle photo is already on file. Choose a new photo only if you want to replace it.':'Upload a clear photo of the vehicle you’ll drive. JPG, PNG or WebP, up to 5 MB.';}
async function vehiclePhotoExtension(file){
 const bad=()=>new Error('Choose a JPG, PNG or WebP vehicle photo up to 5 MB.');
 if(!Object.hasOwn(photoTypes,file.type)||file.size<=0||file.size>5*1024*1024)throw bad();
 const bytes=new Uint8Array(await file.slice(0,12).arrayBuffer());
 const matches=(at,sig)=>sig.every((b,i)=>bytes[at+i]===b);
 const valid=file.type==='image/jpeg'?matches(0,[255,216,255]):file.type==='image/png'?matches(0,[137,80,78,71,13,10,26,10]):matches(0,[82,73,70,70])&&matches(8,[87,69,66,80]);
 if(!valid)throw bad();
 return photoTypes[file.type];
}
async function saveVehiclePhoto(userId,file,ext){
 const path=userId+'/vehicle-photo-'+crypto.randomUUID()+'.'+ext;
 const {error:uploadError}=await client.storage.from('driver-documents').upload(path,file,{contentType:file.type,upsert:false});
 if(uploadError)throw new Error('Could not upload the vehicle photo. Try again.');
 let update=client.from('drivers').update({vehicle_photo_url:path}).eq('user_id',userId);
 update=savedVehiclePhoto===null?update.is('vehicle_photo_url',null):update.eq('vehicle_photo_url',savedVehiclePhoto);
 const {data,error}=await update.select('vehicle_photo_url').maybeSingle();
 if(error||data?.vehicle_photo_url!==path)throw new Error('Could not confirm the vehicle photo was saved. Reload to check your current photo before retrying.');
 savedVehiclePhoto=path;setVehiclePhotoStatus();
}
async function loadSavedVehicle(){const{data:{user}}=await client.auth.getUser();if(!user)return;const{data:row,error}=await client.from('drivers').select('vehicle_type,vehicle_description,license_plate,vehicle_photo_url,insurance_review_status,registration_review_status,insurance_document_path,registration_document_path').eq('user_id',user.id).maybeSingle();if(error)throw error;const data=row||{};savedVehiclePhoto=data.vehicle_photo_url??null;setVehiclePhotoStatus();expectedPaths.insurance=data.insurance_document_path||null;expectedPaths.registration=data.registration_document_path||null;documentUserId=user.id;documentSubmit=createDriverDocumentUploader(client,user.id,expectedPaths);document.getElementById('vehicleType').value=data.vehicle_type||'';document.getElementById('vehicleDescription').value=data.vehicle_description||'';document.getElementById('plate').value=data.license_plate||'';for(const type of ['insurance','registration']){const input=document.getElementById(type),note=document.createElement('p');note.className='muted';note.textContent=driverDocumentLabel(data[type+'_document_path'],data[type+'_review_status']);input.parentElement.appendChild(note);input.required=(!data[type+'_document_path']&&!data[type+'_review_status'])||data[type+'_review_status']==='attention';}}(async()=>{const{data}=await client.auth.getSession();if(!data.session)location.href='/driver-application.html';else await loadSavedVehicle();})().catch(err=>{show('error',err.message||'Could not load document status. Please reload.');document.getElementById('submitBtn').disabled=true;});document.getElementById('vehicle').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Saving…';try{const{data:{user}}=await client.auth.getUser();if(!user)throw new Error('Your verified session expired.');if(!documentSubmit||documentUserId!==user.id)throw new Error('Reload this page to verify your current document versions before saving.');const vehicleType=document.getElementById('vehicleType').value.trim(),vehicleDescription=document.getElementById('vehicleDescription').value.trim(),plate=document.getElementById('plate').value.trim(),insurance=document.getElementById('insurance').files[0],registration=document.getElementById('registration').files[0];if(!vehicleType||!vehicleDescription||!plate)throw new Error('Complete all vehicle fields.');const vehiclePhoto=document.getElementById('vehiclePhoto').files[0];if(!vehiclePhoto&&!savedVehiclePhoto)throw new Error('Upload a photo of your vehicle before continuing.');const photoExt=vehiclePhoto?await vehiclePhotoExtension(vehiclePhoto):null;const{error:saveError}=await client.rpc('save_driver_vehicle_section',{p_vehicle_type:vehicleType,p_vehicle_description:vehicleDescription,p_license_plate:plate});if(saveError)throw saveError;if(insurance)await documentSubmit('insurance',insurance);if(registration)await documentSubmit('registration',registration);if(vehiclePhoto)await saveVehiclePhoto(user.id,vehiclePhoto,photoExt);show('success','Vehicle information saved. Moving to Background Check…');setTimeout(()=>location.href='/driver-background-check.html',700);}catch(err){show('error',err.message||'Could not save vehicle information.');btn.disabled=false;btn.textContent='Save & Continue';}});</script></body></html>
