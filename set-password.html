<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K&E Connect | Verify Email</title><link rel="stylesheet" href="styles.css"><style>body{background:#041426;min-height:100vh}.verify-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.verify-card{width:min(560px,100%);background:#0b2139;border:1px solid #173652;border-radius:26px;padding:30px;text-align:center}.verify-card img{width:220px;margin:auto}.verify-card h1{font-size:2rem;margin:18px 0 8px}.verify-card p{color:#9fb0c5;line-height:1.6}.spinner{width:38px;height:38px;border:4px solid #173652;border-top-color:#1484ff;border-radius:50%;margin:24px auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.verify-error{display:none;background:#3a1720;border:1px solid #8a3447;color:#ffe3e9;border-radius:14px;padding:14px;margin-top:18px}.verify-error.show{display:block}</style></head><body><main class="verify-shell"><section class="verify-card"><img src="ke-connect-logo-new.png" alt="K&E Connect"><p class="eyebrow">EMAIL VERIFICATION</p><h1 id="title">Verifying your email…</h1><div class="spinner" id="spinner"></div><p id="message">Please wait while we securely verify your K&E driver application.</p><div id="error" class="verify-error"></div><a id="restart" class="button primary" href="driver-application.html" style="display:none">Return to Driver Application</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const title=document.getElementById('title'),message=document.getElementById('message'),spinner=document.getElementById('spinner'),errorBox=document.getElementById('error'),restart=document.getElementById('restart');function fail(msg){spinner.style.display='none';title.textContent='Verification link problem';message.textContent='We could not verify this application link.';errorBox.textContent=msg;errorBox.classList.add('show');restart.style.display='inline-block'}try{const client=supabase.createClient('https://yvppsjgyedqcvfbhrhrm.supabase.co','sb_publishable_2QMw5NredQMVvWOHhV1gWg_YYuOryO7',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const params=new URLSearchParams(location.search);const code=params.get('code');if(code){const {error}=await client.auth.exchangeCodeForSession(code);if(error)throw error}else{const hash=new URLSearchParams(location.hash.replace(/^#/,''));const access=hash.get('access_token'),refresh=hash.get('refresh_token');if(access&&refresh){const {error}=await client.auth.setSession({access_token:access,refresh_token:refresh});if(error)throw error}}const {data:{user},error:userError}=await client.auth.getUser();if(userError||!user)throw userError||new Error('No verified session was found. The link may have expired or already been used.');spinner.style.display='none';title.textContent='Email verified!';message.textContent='Thank you. Taking you to your K&E driver onboarding now…';history.replaceState({},'',location.pathname);setTimeout(()=>location.replace('driver-onboarding.html'),700)}catch(err){fail(err&&err.message?err.message:'Please start the application again to receive a new verification link.')}})();</script></body></html>
