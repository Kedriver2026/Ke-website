name: Deploy K&E Website to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - ke-delivery-kate
    paths:
      - "index.html"
      - "become-a-driver.html"
      - "privacy-policy.html"
      - "*.js"
      - "*.css"
      - "*.png"
      - "*.webp"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy ke-connect
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def check(url, label):
              req=urllib.request.Request(url, headers={"Authorization":f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req) as r:
                      data=json.load(r)
                      print(label, "HTTP", r.status, "success=", data.get("success"))
              except urllib.error.HTTPError as e:
                  body=e.read().decode("utf-8","replace")
                  try:
                      data=json.loads(body)
                      errs=[{"code":x.get("code"),"message":x.get("message")} for x in data.get("errors",[])]
                  except Exception:
                      errs=[]
                  print(label, "HTTP", e.code, "errors=", errs)
          check("https://api.cloudflare.com/client/v4/user/tokens/verify","token_verify")
          check(f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/services/ke-connect","worker_access")
          PY

      - name: Prepare website assets
        run: |
          rm -rf public
          mkdir public
          cp index.html become-a-driver.html privacy-policy.html script.js styles.css public/
          cp kate-intent-runtime.js kate-pod-runtime.js kate-status-runtime.js public/
          cp *.png *.webp public/ 2>/dev/null || true

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"
          command: deploy
