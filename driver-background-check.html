<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K&E Connect | Background Check</title><link rel="stylesheet" href="styles.css"><style>body{background:#041426;color:#fff}.wrap{width:min(720px,calc(100% - 32px));margin:auto;padding:28px 0 70px}.brand{text-align:center}.brand img{width:210px}.card{background:#0b2139;border:1px solid #173652;border-radius:24px;padding:24px;margin-top:20px}.form{display:grid;gap:14px}.form label{display:grid;gap:7px;font-weight:800}.form input{background:#071a2e;color:white;border:1px solid #294966;border-radius:14px;padding:14px;font:inherit}.check{display:flex!important;grid-template-columns:auto 1fr;gap:10px!important;align-items:flex-start;background:#071a2e;border:1px solid #173652;border-radius:14px;padding:14px}.muted{color:#9fb0c5;line-height:1.55}.button{border:0;cursor:pointer}.status{display:none;margin-top:14px;padding:14px;border-radius:14px}.success{display:block;background:#0b342b;border:1px solid #1d765e}.error{display:block;background:#3a1720;border:1px solid #8a3447}.back{display:block;text-align:center;color:#5bb2ff;text-decoration:none;font-weight:900;margin-top:18px}</style></head><body><main class="wrap"><div class="brand"><img src="ke-connect-logo-new.png" alt="K&E Connect"><p>Driver Onboarding</p></div><section class="card"><p class="eyebrow">BACKGROUND CHECK</p><h1>Authorization</h1><p class="muted">K&E requires your authorization before a background screening can be requested.</p><form id="background" class="form"><label class="check"><input id="consent" type="checkbox" required><span>I authorize K&E Delivery Express and its screening provider to obtain background information permitted by law for driver eligibility review.</span></label><label>Electronic signature<input id="signature" placeholder="Type your full legal name" required></label><button class="button primary" id="submitBtn" type="submit">Authorize & Continue</button></form><div id="status" class="status"></div><a class="back" href="driver-onboarding.html">← Back to Onboarding</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://yvppsjgyedqcvfbhrhrm.supabase.co','sb_publishable_2QMw5NredQMVvWOHhV1gWg_YYuOryO7');const statusBox=document.getElementById('status');function show(type,msg){statusBox.className='status '+type;statusBox.textContent=msg}(async()=>{const{data}=await client.auth.getSession();if(!data.session)location.href='/driver-application.html';})();document.getElementById('background').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Saving…';try{const signature=document.getElementById('signature').value.trim();if(!document.getElementById('consent').checked||signature.length<3)throw new Error('Authorization and signature are required.');const{error}=await client.auth.updateUser({data:{background_check_authorized:true,background_check_signature:signature,background_check_authorized_at:new Date().toISOString()}});if(error)throw error;show('success','Background check authorization saved. Moving to W-9…');setTimeout(()=>location.href='/driver-w9.html',700);}catch(err){show('error',err.message||'Could not save authorization.');}finally{btn.disabled=false;btn.textContent='Authorize & Continue';}});</script></body></html>
