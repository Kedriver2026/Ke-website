<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K&E Connect | W-9</title><link rel="stylesheet" href="styles.css"><style>body{background:#041426;color:#fff}.wrap{width:min(720px,calc(100% - 32px));margin:auto;padding:28px 0 70px}.brand{text-align:center}.brand img{width:210px}.card{background:#0b2139;border:1px solid #173652;border-radius:24px;padding:24px;margin-top:20px}.form{display:grid;gap:14px}.form label{display:grid;gap:7px;font-weight:800}.form input,.form select{background:#071a2e;color:white;border:1px solid #294966;border-radius:14px;padding:14px;font:inherit}.check{display:flex;gap:10px;align-items:flex-start;background:#071a2e;border:1px solid #173652;border-radius:14px;padding:14px}.muted{color:#9fb0c5;line-height:1.55}.button{border:0;cursor:pointer}.status{display:none;margin-top:14px;padding:14px;border-radius:14px}.success{display:block;background:#0b342b;border:1px solid #1d765e}.error{display:block;background:#3a1720;border:1px solid #8a3447}.back{display:block;text-align:center;color:#5bb2ff;text-decoration:none;font-weight:900;margin-top:18px}</style></head><body><main class="wrap"><div class="brand"><img src="ke-connect-logo-new.png" alt="K&E Connect"><p>Driver Onboarding</p></div><section class="card"><p class="eyebrow">FORM W-9</p><h1>Tax Information</h1><p class="muted">Request for Taxpayer Identification Number and Certification.</p><form id="w9" class="form"><label>Legal name<input id="legalName" required></label><label>Business name<input id="businessName" placeholder="If different from legal name"></label><label>Federal tax classification<select id="classification" required><option value="">Select one</option><option>Individual / Sole Proprietor</option><option>C Corporation</option><option>S Corporation</option><option>Partnership</option><option>Trust / Estate</option><option>LLC</option></select></label><label>Address<input id="address" required></label><label>City, State & ZIP<input id="cityStateZip" required></label><label>SSN or EIN<input id="tin" inputmode="numeric" required></label><label>Electronic signature<input id="signature" required></label><label class="check"><input id="certified" type="checkbox" required><span>I certify that the information provided is true and correct.</span></label><button class="button primary" id="submitBtn" type="submit">Submit W-9</button></form><div id="status" class="status"></div><a class="back" href="driver-onboarding.html">← Back to Onboarding</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://yvppsjgyedqcvfbhrhrm.supabase.co','sb_publishable_2QMw5NredQMVvWOHhV1gWg_YYuOryO7');const statusBox=document.getElementById('status');function show(type,msg){statusBox.className='status '+type;statusBox.textContent=msg}(async()=>{const{data}=await client.auth.getSession();if(!data.session)location.href='/driver-application.html';})();document.getElementById('w9').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Submitting…';try{const tin=document.getElementById('tin').value.replace(/\D/g,'');if(tin.length<4)throw new Error('Enter a valid SSN or EIN.');const{error}=await client.rpc('submit_driver_w9',{p_legal_name:document.getElementById('legalName').value.trim(),p_business_name:document.getElementById('businessName').value.trim(),p_tax_classification:document.getElementById('classification').value,p_address:document.getElementById('address').value.trim(),p_city_state_zip:document.getElementById('cityStateZip').value.trim(),p_tin_last4:tin.slice(-4),p_certified:document.getElementById('certified').checked,p_signature_name:document.getElementById('signature').value.trim()});if(error)throw error;show('success','W-9 completed and added to your onboarding file.');}catch(err){show('error',err.message||'Could not submit W-9.');}finally{btn.disabled=false;btn.textContent='Submit W-9';}});</script></body></html>
