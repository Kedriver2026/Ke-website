<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K&E Connect | Personal Information</title><link rel="stylesheet" href="styles.css"><style>body{background:#041426;color:#fff}.wrap{width:min(720px,calc(100% - 32px));margin:auto;padding:28px 0 70px}.brand{text-align:center}.brand img{width:210px}.card{background:#0b2139;border:1px solid #173652;border-radius:24px;padding:24px;margin-top:20px}.muted{color:#9fb0c5;line-height:1.55}.form{display:grid;gap:14px}.form label{display:grid;gap:7px;font-weight:800}.form input{background:#071a2e;color:#fff;border:1px solid #294966;border-radius:14px;padding:14px;font:inherit}.filebox{background:#071a2e;border:1px solid #173652;border-radius:14px;padding:14px}.button{border:0;cursor:pointer}.status{display:none;margin-top:14px;padding:14px;border-radius:14px}.success{display:block;background:#0b342b;border:1px solid #1d765e}.error{display:block;background:#3a1720;border:1px solid #8a3447}.back{display:block;text-align:center;color:#5bb2ff;text-decoration:none;font-weight:900;margin-top:18px}.progress{height:8px;background:#102f4d;border-radius:8px;overflow:hidden;margin-top:12px}.progress span{display:block;width:25%;height:100%;background:#1484ff}</style></head><body><main class="wrap"><div class="brand"><img src="ke-connect-logo-new.png" alt="K&E Connect"><p>Verified Applicant Onboarding</p></div><section class="card"><p class="eyebrow">STEP 1 OF 4</p><h1>Personal Information</h1><p class="muted">Complete your personal information and upload your profile photo and driver's license.</p><div class="progress"><span></span></div><form id="personal" class="form"><label>Home address<input id="address" autocomplete="street-address" required></label><div class="filebox"><label>Profile picture<input id="profile" type="file" accept="image/*" required></label></div><div class="filebox"><label>Driver's license<input id="license" type="file" accept="image/*" required></label></div><button class="button primary" id="submitBtn" type="submit">Save & Continue</button></form><div id="status" class="status"></div><a class="back" href="driver-onboarding.html">← Back to Onboarding</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://yvppsjgyedqcvfbhrhrm.supabase.co','sb_publishable_2QMw5NredQMVvWOHhV1gWg_YYuOryO7');const box=document.getElementById('status');function show(t,m){box.className='status '+t;box.textContent=m}async function upload(file,userId,prefix){const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=userId+'/'+prefix+'-'+Date.now()+'.'+ext;const{error}=await client.storage.from('driver-documents').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});if(error)throw error;return path}(async()=>{const{data}=await client.auth.getSession();if(!data.session)location.href='/driver-application.html';})();document.getElementById('personal').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Saving…';try{const{data:{user}}=await client.auth.getUser();if(!user)throw new Error('Your verified session expired.');const address=document.getElementById('address').value.trim(),profile=document.getElementById('profile').files[0],license=document.getElementById('license').files[0];if(!address||!profile||!license)throw new Error('Complete all fields and uploads.');const{error:saveError}=await client.rpc('save_driver_personal_section',{p_home_address:address});if(saveError)throw saveError;const profilePath=await upload(profile,user.id,'profile');await upload(license,user.id,'license');const{error:updateError}=await client.from('drivers').update({driver_photo_url:profilePath,license_review_status:'pending'}).eq('user_id',user.id);if(updateError)throw updateError;show('success','Personal information saved. Moving to Vehicle Information…');setTimeout(()=>location.href='/driver-vehicle.html',700);}catch(err){show('error',err.message||'Could not save personal information.');btn.disabled=false;btn.textContent='Save & Continue';}});</script></body></html>
