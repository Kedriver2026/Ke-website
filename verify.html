ess=hash.get('access_token'),refresh=hash.get('refresh_token');if(code){const{error}=await client.auth.exchangeCodeForSession(code);if(error)throw error}else if(access&&refresh){const{error}=await client.auth.setSession({access_token:access,refresh_token:refresh});if(error)throw error}else{await new Promise(r=>setTimeout(r,350))}const{data:{session}}=await client.auth.getSession();if(!session)throw new Error('This verification link is invalid or has expired. Please request a new application link.');const meta=session.user.user_metadata||{};const{error}=await client.rpc('submit_driver_application',{p_home_market_code:'AUS',p_home_address:'',p_vehicle_type:meta.vehicle_type||'',p_vehicle_description:meta.vehicle_description||'',p_license_plate:''});if(error)throw error;history.replaceState({},document.title,'verify.html');title.textContent='Email verified!';message.textContent='Your email is confirmed. Taking you to K&E onboarding…';setTimeout(()=>location.replace('onboarding.html'),700)}catch(e){fail(e?.message||'Please request a new application link.')}}run();</script></body></html>
